name: Rassegna stampa

on:
  schedule:
    # Ogni giorno alle 5:00 UTC (6:00 in inverno, 7:00 con l'ora legale).
    # GitHub può partire con qualche minuto di ritardo.
    - cron: "0 5 * * *"
  workflow_dispatch:   # per lanciarla a mano dalla scheda Actions

permissions:
  contents: write

concurrency:
  group: rassegna
  cancel-in-progress: false

jobs:
  rassegna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepara il report
        run: python rassegna.py

      - name: Salva il report nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs dati
          if git diff --cached --quiet; then
            echo "Niente da salvare"
          else
            git commit -m "Rassegna del $(TZ=Europe/Rome date +%Y-%m-%d)"
            git push
          fi
