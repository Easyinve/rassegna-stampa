name: Rassegna stampa

on:
  schedule:
    # Gli avvii programmati di GitHub non sono affidabili: possono slittare
    # anche di ore o saltare del tutto, soprattutto allo scoccare dell'ora e
    # della mezz'ora. Per questo il workflow viene "bussato" più volte ogni
    # mattina, a minuti insoliti (ogni 20 minuti, dalle 4:07 alle 9:47 UTC),
    # e il primo passo decide se partire davvero: solo dalle 6:30 italiane in
    # poi (GitHub ragiona in UTC e non conosce l'ora legale, l'orario italiano
    # lo calcola lo script) e solo se la rassegna automatica di oggi non è
    # ancora stata fatta. Se è già fatta ma qualche traduzione non è riuscita,
    # riprova solo quelle. Gli avvii in più si chiudono in pochi secondi.
    - cron: "7,27,47 4-9 * * *"
  workflow_dispatch:   # avvio a mano: dalla scheda Actions o dal pulsante nella pagina

permissions:
  contents: write

concurrency:
  group: rassegna
  cancel-in-progress: false

jobs:
  rassegna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Controlla se è il momento
        id: orario
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Avvio a mano"; echo "parti=si" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ora=$(TZ=Europe/Rome date +%H%M)
          oggi=$(TZ=Europe/Rome date +%F)
          fatta=$(cat dati/ultima-automatica.txt 2>/dev/null || true)
          if [ "$ora" -lt 0630 ]; then
            echo "Sono le $ora in Italia: troppo presto"; echo "parti=no" >> "$GITHUB_OUTPUT"
          elif [ "$fatta" = "$oggi" ]; then
            mancanti=$(python3 -c "import json;d=json.load(open('dati/$oggi.json'));print(sum(1 for t in d['temi'] if t.get('traduci') for a in t['articoli'] if not a.get('tradotto')))" 2>/dev/null || echo 0)
            if [ "$mancanti" -gt 0 ]; then
              echo "Rassegna già fatta, ma $mancanti traduzioni da rifare"; echo "parti=ritraduci" >> "$GITHUB_OUTPUT"
            else
              echo "La rassegna automatica di oggi è già fatta"; echo "parti=no" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "parti=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.orario.outputs.parti != 'no'
        with:
          python-version: "3.12"

      - name: Prepara il report
        if: steps.orario.outputs.parti == 'si'
        run: python rassegna.py
        env:
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}   # facoltativo

      - name: Riprova le traduzioni non riuscite
        if: steps.orario.outputs.parti == 'ritraduci'
        run: python rassegna.py --ritraduci
        env:
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}

      - name: Salva il report nel repository
        if: steps.orario.outputs.parti != 'no'
        run: |
          if [ "${{ steps.orario.outputs.parti }}" = "si" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            TZ=Europe/Rome date +%F > dati/ultima-automatica.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs dati
          if git diff --cached --quiet; then
            echo "Niente da salvare"
          else
            git commit -m "Rassegna del $(TZ=Europe/Rome date '+%Y-%m-%d %H:%M')"
            git pull --rebase --quiet
            git push
          fi
