# Temi della rassegna stampa.
#
# Ogni tema ha:
#   nome    -> il titolo della sezione nel report
#   query   -> la ricerca su Google News (stessa sintassi del sito:
#              virgolette per le frasi esatte, OR per le alternative,
#              -parola per escludere)
#   parole  -> (facoltativo ma consigliato) almeno una di queste deve
#              comparire nel TITOLO, altrimenti l'articolo viene scartato.
#              Serve perché Google News trova anche pagine che citano il
#              tema solo nella barra laterale. Basta un pezzo di parola:
#              "aten" trova sia "ateneo" sia "atenei".
#   escludi -> (facoltativo) parole che, se compaiono nel titolo,
#              fanno scartare l'articolo
#   ore     -> (facoltativo) quanto indietro cercare per questo tema;
#              utile per i temi di nicchia con poche notizie al giorno
#   fonti_specialistiche -> (facoltativo) domini della stampa di settore
#              per questo tema: finiscono nel gruppo "Stampa specializzata"
#
# Maiuscole e minuscole non contano. Per aggiungere un tema basta copiare
# uno dei blocchi qui sotto e modificarlo.

[impostazioni]
titolo = "Rassegna stampa"
ore = 24                 # quanto indietro cercare (se il tema non dice altro)
max_articoli = 15        # massimo per tema, in ciascun gruppo di fonti
max_per_fonte = 4        # massimo di articoli della stessa testata per gruppo
lingua = "it"
paese = "IT"

# Testate generaliste considerate autorevoli: valgono per tutti i temi e
# finiscono nel gruppo "Giornali". Si indica il dominio del sito (senza
# https:// e www.); i sottodomini sono compresi, quindi "corriere.it"
# include anche corrieredelmezzogiorno.corriere.it.
# Se si svuotano questo elenco e quelli specialistici, la rassegna torna
# a prendere articoli da tutte le fonti.
fonti_autorevoli = [
  # agenzie
  "ansa.it", "agi.it", "adnkronos.com",
  # quotidiani e siti nazionali
  "corriere.it", "repubblica.it", "lastampa.it", "ilsole24ore.com",
  "ilpost.it", "avvenire.it", "ilmessaggero.it", "ilfattoquotidiano.it",
  "ilfoglio.it", "editorialedomani.it", "ilgiornale.it", "ilmanifesto.it",
  "open.online", "lespresso.it", "internazionale.it", "huffingtonpost.it",
  "linkiesta.it", "lavoce.info", "pagellapolitica.it", "milanofinanza.it",
  # tv e radio
  "rainews.it", "tg24.sky.it", "tgcom24.mediaset.it", "la7.it",
  # grandi quotidiani locali
  "ilmattino.it", "ilgazzettino.it", "ilsecoloxix.it", "lanazione.it",
  "ilrestodelcarlino.it", "ilgiorno.it", "gazzettadelsud.it",
  "lagazzettadelmezzogiorno.it", "unionesarda.it", "lanuovasardegna.it",
  "messaggeroveneto.it", "ildolomiti.it", "ladige.it",
]

# Fonti da scartare sempre (basta un pezzo del nome o del dominio)
fonti_escluse = []


[[tema]]
